<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHK Fahrzeugverwaltung V1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px #0001;
}

.card h3 {
    margin-top: 0;
}

.number {
    font-size: 30px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #2563eb;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toolbar input {
    flex: 1;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

.vehicle {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px #0001;
}

.vehicle-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.vehicle-header h3 {
    margin: 0;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.ok {
    background: #dcfce7;
    color: #166534;
}

.warning {
    background: #fef3c7;
    color: #92400e;
}

.overdue {
    background: #fee2e2;
    color: #991b1b;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 750px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 15px;
    padding: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.full {
    grid-column: 1 / -1;
}

.form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

@media(max-width: 800px) {
    .dashboard {
        grid-template-columns: 1fr 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}

@media(max-width: 500px) {
    .dashboard {
        grid-template-columns: 1fr 1fr;
    }

    .container {
        padding: 10px;
    }

    .toolbar {
        flex-direction: column;
    }

    .vehicle-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚐 SHK Fahrzeugverwaltung V1</h1>
</header>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <div>Fahrzeuge</div>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <div>🟢 Alles OK</div>
            <div class="number" id="ok">0</div>
        </div>

        <div class="card">
            <div>🟠 Bald fällig</div>
            <div class="number" id="warning">0</div>
        </div>

        <div class="card">
            <div>🔴 Überfällig</div>
            <div class="number" id="overdue">0</div>
        </div>

    </div>

    <div class="card">

        <div class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Kennzeichen, Fahrzeug oder Fahrer suchen..."
                oninput="renderVehicles()"
            >

            <button class="primary" onclick="openModal()">
                + Fahrzeug hinzufügen
            </button>

        </div>

        <div id="vehicles"></div>

    </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2 id="modalTitle">Fahrzeug hinzufügen</h2>

<form id="vehicleForm">

<div class="form-grid">

<div class="field">
<label>Kennzeichen *</label>
<input id="plate" required>
</div>

<div class="field">
<label>Hersteller</label>
<input id="brand">
</div>

<div class="field">
<label>Modell</label>
<input id="model">
</div>

<div class="field">
<label>Baujahr</label>
<input id="year" type="number">
</div>

<div class="field">
<label>FIN</label>
<input id="vin">
</div>

<div class="field">
<label>Kilometerstand</label>
<input id="mileage" type="number">
</div>

<div class="field">
<label>Motor</label>
<input id="engine">
</div>

<div class="field">
<label>Kraftstoff</label>

<select id="fuel">
<option>Diesel</option>
<option>Benzin</option>
<option>Elektro</option>
<option>Hybrid</option>
<option>Sonstige</option>
</select>

</div>

<div class="field">
<label>Öl</label>
<input id="oil" placeholder="z.B. 5W-30">
</div>

<div class="field">
<label>Ölmenge (Liter)</label>
<input id="oilAmount" type="number" step="0.1">
</div>

<div class="field">
<label>Reifen</label>
<input id="tires">
</div>

<div class="field">
<label>Fahrer</label>
<input id="driver">
</div>

<div class="field">
<label>TÜV</label>
<input id="tuv" type="date">
</div>

<div class="field">
<label>UVV</label>
<input id="uvv" type="date">
</div>

<div class="field">
<label>Service</label>
<input id="service" type="date">
</div>

<div class="field">
<label>Ölwechsel</label>
<input id="oilChange" type="date">
</div>

<div class="field full">
<label>Notizen</label>
<textarea id="notes" rows="4"></textarea>
</div>

</div>

<div class="form-buttons">

<button
type="button"
class="secondary"
onclick="closeModal()">
Abbrechen
</button>

<button
type="submit"
class="primary">
Speichern
</button>

</div>

</form>

</div>

</div>


<script>

let vehicles =
JSON.parse(localStorage.getItem("shkVehicles")) || [];

let editId = null;


const fields = [
"plate",
"brand",
"model",
"year",
"vin",
"mileage",
"engine",
"fuel",
"oil",
"oilAmount",
"tires",
"driver",
"tuv",
"uvv",
"service",
"oilChange",
"notes"
];


function saveData() {

    localStorage.setItem(
        "shkVehicles",
        JSON.stringify(vehicles)
    );

}


function openModal(id = null) {

    editId = id;

    document
        .getElementById("modal")
        .classList
        .add("active");

    if (id) {

        const vehicle =
            vehicles.find(v => v.id === id);

        document.getElementById("modalTitle")
            .innerText =
            "Fahrzeug bearbeiten";

        fields.forEach(field => {

            document.getElementById(field).value =
                vehicle[field] || "";

        });

    } else {

        document.getElementById("modalTitle")
            .innerText =
            "Fahrzeug hinzufügen";

        document
            .getElementById("vehicleForm")
            .reset();

    }

}


function closeModal() {

    document
        .getElementById("modal")
        .classList
        .remove("active");

    editId = null;

}


document
.getElementById("vehicleForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const vehicle = {
        id: editId || Date.now()
    };

    fields.forEach(field => {

        vehicle[field] =
            document.getElementById(field).value;

    });


    if (editId) {

        const index =
            vehicles.findIndex(v => v.id === editId);

        vehicles[index] = vehicle;

    } else {

        vehicles.push(vehicle);

    }


    saveData();

    closeModal();

    renderVehicles();

});


function deleteVehicle(id) {

    if (!confirm(
        "Dieses Fahrzeug wirklich löschen?"
    )) return;

    vehicles =
        vehicles.filter(v => v.id !== id);

    saveData();

    renderVehicles();

}


function daysUntil(date) {

    if (!date) return null;

    const today =
        new Date();

    const target =
        new Date(date);

    today.setHours(0,0,0,0);
    target.setHours(0,0,0,0);

    return Math.ceil(
        (target - today) /
        (1000 * 60 * 60 * 24)
    );

}


function status(date) {

    if (!date)
        return {
            className: "warning",
            text: "Kein Datum"
        };

    const days =
        daysUntil(date);

    if (days < 0) {

        return {
            className: "overdue",
            text: "Überfällig"
        };

    }

    if (days <= 30) {

        return {
            className: "warning",
            text: "Bald fällig"
        };

    }

    return {
        className: "ok",
        text: "OK"
    };

}


function vehicleStatus(vehicle) {

    const dates = [
        vehicle.tuv,
        vehicle.uvv,
        vehicle.service,
        vehicle.oilChange
    ].filter(Boolean);

    if (!dates.length)
        return "warning";

    const statuses =
        dates.map(date => status(date));

    if (statuses.some(s =>
        s.className === "overdue"
    ))
        return "overdue";

    if (statuses.some(s =>
        s.className === "warning"
    ))
        return "warning";

    return "ok";

}


function renderVehicles() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        vehicles.filter(vehicle => {

            return JSON.stringify(vehicle)
                .toLowerCase()
                .includes(search);

        });


    const container =
        document.getElementById("vehicles");


    if (!filtered.length) {

        container.innerHTML = `
            <p style="text-align:center;color:#6b7280">
                Keine Fahrzeuge gefunden.
            </p>
        `;

    } else {

        container.innerHTML =
        filtered.map(vehicle => {

            const overall =
                vehicleStatus(vehicle);

            let overallText =
                overall === "ok"
                ? "Alles OK"
                : overall === "warning"
                ? "Bald fällig"
                : "Überfällig";


            return `

            <div class="vehicle">

                <div class="vehicle-header">

                    <div>

                        <h3>
                            ${vehicle.plate || ""}
                        </h3>

                        <div>
                            ${vehicle.brand || ""}
                            ${vehicle.model || ""}
                            ${vehicle.year || ""}
                        </div>

                    </div>

                    <span class="badge ${overall}">
                        ${overallText}
                    </span>

                </div>


                <hr>


                <p>
                    <b>Fahrer:</b>
                    ${vehicle.driver || "-"}
                </p>

                <p>
                    <b>Kilometer:</b>
                    ${vehicle.mileage || "-"}
                    km
                </p>

                <p>
                    <b>FIN:</b>
                    ${vehicle.vin || "-"}
                </p>

                <p>
                    <b>Motor:</b>
                    ${vehicle.engine || "-"}
                </p>

                <p>
                    <b>Kraftstoff:</b>
                    ${vehicle.fuel || "-"}
                </p>

                <p>
                    <b>Öl:</b>
                    ${vehicle.oil || "-"}
                    ${vehicle.oilAmount
                    ? " / " + vehicle.oilAmount + " l"
                    : ""}
                </p>

                <p>
                    <b>Reifen:</b>
                    ${vehicle.tires || "-"}
                </p>


                <hr>


                <p>
                    <b>TÜV:</b>
                    ${vehicle.tuv || "-"}
                    ${vehicle.tuv
                    ? statusBadge(vehicle.tuv)
                    : ""}
                </p>

                <p>
                    <b>UVV:</b>
                    ${vehicle.uvv || "-"}
                    ${vehicle.uvv
                    ? statusBadge(vehicle.uvv)
                    : ""}
                </p>

                <p>
                    <b>Service:</b>
                    ${vehicle.service || "-"}
                    ${vehicle.service
                    ? statusBadge(vehicle.service)
                    : ""}
                </p>

                <p>
                    <b>Ölwechsel:</b>
                    ${vehicle.oilChange || "-"}
                    ${vehicle.oilChange
                    ? statusBadge(vehicle.oilChange)
                    : ""}
                </p>


                <div class="actions">

                    <button
                    class="primary"
                    onclick="openModal(${vehicle.id})">
                    Bearbeiten
                    </button>

                    <button
                    class="danger"
                    onclick="deleteVehicle(${vehicle.id})">
                    Löschen
                    </button>

                </div>

            </div>

            `;

        }).join("");

    }


    updateDashboard();

}


function statusBadge(date) {

    const s =
        status(date);

    return `
        <span class="badge ${s.className}">
            ${s.text}
        </span>
    `;

}


function updateDashboard() {

    let ok = 0;
    let warning = 0;
    let overdue = 0;


    vehicles.forEach(vehicle => {

        const s =
            vehicleStatus(vehicle);

        if (s === "ok")
            ok++;

        if (s === "warning")
            warning++;

        if (s === "overdue")
            overdue++;

    });


    document.getElementById("total")
        .innerText =
        vehicles.length;

    document.getElementById("ok")
        .innerText =
        ok;

    document.getElementById("warning")
        .innerText =
        warning;

    document.getElementById("overdue")
        .innerText =
        overdue;

}


renderVehicles();

</script>

</body>
</html>
