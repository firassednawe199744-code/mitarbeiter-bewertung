<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mitarbeiterbewertung</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#17202a
}

header{
  background:#17202a;
  color:white;
  text-align:center;
  padding:28px 15px
}

h1{margin:0 0 8px}
.sub{margin:0;color:#d9dee3}

main{
  max-width:650px;
  margin:25px auto;
  padding:0 15px
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 18px #0001
}

label{
  font-weight:bold;
  display:block;
  margin:15px 0 7px
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px
}

.criteria{
  display:grid;
  gap:14px;
  margin-top:20px
}

.item{
  border:1px solid #ddd;
  border-radius:14px;
  padding:16px;
  text-align:center
}

.item b{
  display:block;
  margin-bottom:12px
}

.buttons{
  display:flex;
  justify-content:center;
  gap:8px
}

button.point{
  width:45px;
  height:45px;
  border:1px solid #bbb;
  background:white;
  border-radius:9px;
  font-size:16px
}

button.point.active{
  background:#17202a;
  color:white
}

.total{
  text-align:center;
  font-size:19px;
  font-weight:bold;
  margin:22px 0
}

#send{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#1670b8;
  color:white;
  font-size:17px;
  font-weight:bold
}

#send:disabled{
  background:#aaa
}

#msg{
  text-align:center;
  font-weight:bold;
  margin-top:15px
}
</style>
</head>

<body>

<header>
<h1>Mitarbeiterbewertung</h1>
<p class="sub">Ihre Meinung ist uns wichtig</p>
</header>

<main>
<div class="card">

<label>Name des Kunden</label>
<input
  type="text"
  id="customerName"
  placeholder="Vor- und Nachname"
>

<label>Adresse des Kunden</label>
<input
  type="text"
  id="customerAddress"
  placeholder="Straße, Hausnummer, PLZ, Ort"
>

<label>Mitarbeiter</label>
<select id="employee">
<option>Firas Sednawe</option>
<option>Camih Mire</option>
<option>Anis Flifl</option>
</select>

<div class="criteria">

<div class="item">
<b>⏰ Pünktlichkeit</b>
<div class="buttons" data-name="p"></div>
</div>

<div class="item">
<b>🧹 Sauberkeit</b>
<div class="buttons" data-name="s"></div>
</div>

<div class="item">
<b>🙂 Freundlichkeit</b>
<div class="buttons" data-name="f"></div>
</div>

</div>

<div class="total">
Punkte: <span id="total">0</span> / 3
</div>

<button id="send" disabled>
Bewertung absenden
</button>

<div id="msg"></div>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://npabtjssyjmngzqxkmw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4zqNs0F423SjEudPEeRdew_9VEtVly7";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let score={p:0,s:0,f:0};

document.querySelectorAll(".buttons").forEach(box=>{

  for(let i=0;i<=3;i++){

    let b=document.createElement("button");

    b.type="button";
    b.className="point";
    b.textContent=i;

    b.onclick=()=>{

      let other=Object.keys(score)
        .filter(k=>k!==box.dataset.name)
        .reduce((a,k)=>a+score[k],0);

      if(other+i>3)return;

      score[box.dataset.name]=i;

      box.querySelectorAll("button").forEach((x,n)=>{
        x.classList.toggle("active",n===i);
      });

      checkForm();
    };

    box.appendChild(b);
  }

});

function checkForm(){

  let total=score.p+score.s+score.f;

  document.getElementById("total").textContent=total;

  document.getElementById("send").disabled=
    total!==3 ||
    document.getElementById("customerName").value.trim()==="" ||
    document.getElementById("customerAddress").value.trim()==="";
}

document.getElementById("customerName")
.addEventListener("input",checkForm);

document.getElementById("customerAddress")
.addEventListener("input",checkForm);


document.getElementById("send").onclick=async()=>{

  const button=document.getElementById("send");
  const msg=document.getElementById("msg");

  button.disabled=true;
  msg.textContent="Bewertung wird gesendet...";

  const {error}=await supabaseClient
    .from("Mitarbeiter-Bewertung")
    .insert({

      kundenname:
        document.getElementById("customerName").value.trim(),

      kundenadresse:
        document.getElementById("customerAddress").value.trim(),

      mitarbeiter:
        document.getElementById("employee").value,

      puenktlichkeit:score.p,

      sauberkeit:score.s,

      freundlichkeit:score.f

    });

  if(error){

    console.error(error);

    msg.textContent=
      "Fehler beim Senden. Bitte versuchen Sie es erneut.";

    button.disabled=false;

    return;
  }

  msg.textContent=
    "Vielen Dank für Ihre Bewertung!";

  document.getElementById("customerName").value="";
  document.getElementById("customerAddress").value="";

  score={p:0,s:0,f:0};

  document.getElementById("total").textContent="0";

  document.querySelectorAll(".point").forEach(b=>
    b.classList.remove("active")
  );

  button.disabled=true;
};

</script>

</body>
</html>
